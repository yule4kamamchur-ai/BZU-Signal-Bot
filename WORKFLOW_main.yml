name: BZU Auto Bot — ICT v12.20.0 — 3m Causal Scan / 15m Reports

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Keep the original lock so queued runs of the old workflow cannot overlap.
concurrency:
  group: bzu-signal-memory
  cancel-in-progress: false

jobs:
  run-bot:
    # Set repository variable BZU_EXECUTION_MODE=WORKER when the persistent
    # 3m host starts. Running both writers would corrupt the paper ledger.
    if: ${{ vars.BZU_EXECUTION_MODE != 'WORKER' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BOT_BRANCH: ${{ github.event.repository.default_branch }}
      JOURNAL_PERSISTENCE_CONFIRMED: 'true'
      SIGNAL_MEMORY_FILE: last_signal_v6_4.json
      SIGNAL_JOURNAL_FILE: signal_journal_v6_4.json
      MARKET_HISTORY_FILE: market_history_v12.json
      RESEARCH_ARCHIVE_FILE: research_market_v12_6.json
      OKX_INST_ID: ${{ vars.OKX_INST_ID || 'BZ-USDT-SWAP' }}
      # Live price tick is read from OKX by full_limit_engine.py.
      EXPECTED_BOT_VERSION: 'full-ict-v12.20.0-reviewed-short'
      INCLUDE_COMMISSION: 'true'
      ANALYSIS_SCAN_MINUTES: '5'
      LIMIT_MAX_STOP_ATR: '4.00'
      ABS_MIN_STOP_PCT: '0.010'
      MIN_TP1_DISTANCE_PCT: '0.020'
      MAKER_FEE_RATE: ${{ vars.MAKER_FEE_RATE || '0.0002' }}
      TAKER_FEE_RATE: ${{ vars.TAKER_FEE_RATE || '0.0005' }}
      PYTHONUNBUFFERED: '1'
      MARKET_FETCH_TIMING: 'true'
      BOT_STAGE_TIMING: 'true'
      # GitHub Actions minimum cron spacing is 5m. Every scan can use the last
      # CLOSED 3m event; exact every-3m wakeup requires continuous_worker.py
      # on a persistent host. Reports remain one per 15m UTC bucket.
      # Real exchange execution is NOT enabled (paper lifecycle).
      BZU_EDGE_MODE: 'SHADOW'
      BZU_ENTRY_PLAYBOOK_MODE: 'STRICT'

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
          # The job needs only HEAD to write its state-only commit.
          # Never download the full trading-ledger history on every scan.
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # v12 has a stdlib fallback; requirements.txt is not required.
      # Run only cheap safety checks in live trading. The full regression suite can run offline with --self-test.
      - name: Fast preflight (version, detectors, imports and syntax)
        run: |
          python -m py_compile bot_oneshot.py full_limit_engine.py notification_report.py \
            setup_scanner.py signal_quality.py ict_methodology.py portfolio_arbitration.py \
            entry_adverse_selection.py edge_intelligence.py entry_playbooks.py strategy_organics.py strategy_direct_entries.py edge_research.py strategy_research.py trade_meta_model.py directional_policy.py setup_paths.py
          python - <<'PY'
          from pathlib import Path
          import os
          must_exist = (
              'bot_oneshot.py', 'full_limit_engine.py', 'notification_report.py',
              'setup_scanner.py', 'signal_quality.py', 'ict_methodology.py',
              'portfolio_arbitration.py', 'entry_adverse_selection.py', 'edge_intelligence.py',
              'entry_playbooks.py', 'strategy_organics.py', 'strategy_direct_entries.py',
              'trade_meta_model.py', 'directional_policy.py', 'setup_paths.py',
              'last_signal_v6_4.json', 'signal_journal_v6_4.json',
          )
          missing = [file for file in must_exist if not Path(file).is_file()]
          if missing:
              raise SystemExit('Missing production files: ' + ', '.join(missing))
          import bot_oneshot as core
          import full_limit_engine as engine
          import setup_paths
          import entry_playbooks
          entry_playbooks.validate_contracts(core.DETECTED_SETUP_TYPES)
          actual = (core.BOT_VERSION, engine.VERSION, len(core.DETECTORS))
          expected = os.environ['EXPECTED_BOT_VERSION']
          print(f'Version check: launcher={actual[0]}, engine={actual[1]}, detectors={actual[2]}/24, expected={expected}')
          if (actual[0] != expected or actual[1] != expected or actual[2] != 24):
              raise SystemExit('Mismatched v12.20.0 files: update bot_oneshot.py and full_limit_engine.py together. '
                               f'launcher={actual[0]}, engine={actual[1]}, detectors={actual[2]}, expected={expected}')
          if 'RANGE_COMPRESSION_BREAKOUT' not in setup_paths.BREAK_RETEST:
              raise SystemExit('setup_paths.py is older than v12.13: replace it from the complete v12.13 patch')
          print('Fast preflight OK; running market scan without full test suite.')
          PY

      - name: Verify Telegram settings
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('TELEGRAM_TOKEN') or not os.environ.get('TELEGRAM_CHAT_ID'):
              raise SystemExit('Set TELEGRAM_TOKEN and TELEGRAM_CHAT_ID in GitHub Actions secrets')
          PY

      - name: Fast scan (closed 3m) with 15m report gating
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *' }}
        id: bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NOTIFY_EVERY_RUN: 'true'
        run: python bot_oneshot.py --auto-report

      - name: Save signal memory and journal
        id: persist
        if: ${{ always() && (steps.bot.outcome == 'success' || steps.bot.outcome == 'failure') }}
        shell: bash
        run: |
          started=$SECONDS
          trap 'echo "[PERF] git_state_persistence: ${SECONDS-started}s"' EXIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Commit only runtime files, never remove unrelated or legacy files.
          for file in last_signal_v6_4.json signal_journal_v6_4.json market_history_v12.json research_market_v12_6.json; do
            if [ -f "$file" ]; then
              git add -f -- "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo 'No memory/journal changes to commit.'
            exit 0
          fi

          git commit -m 'Update full ICT v12 memory and journal [skip ci]'

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BOT_BRANCH}"; then
              echo 'Memory and journal saved.'
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              break
            fi

            # Read only the newest remote commit, even if we are shallow.
            # Tree comparison below needs the two tips, NOT their ancestry.
            base_revision=$(git rev-parse HEAD^)
            git fetch --no-tags --depth=1 origin "$BOT_BRANCH"
            remote_revision=$(git rev-parse FETCH_HEAD)

            # A different writer changed the same ledger: preserve both copies.
            if ! git diff --quiet "$base_revision" "$remote_revision" -- \
                last_signal_v6_4.json signal_journal_v6_4.json market_history_v12.json research_market_v12_6.json; then
              echo '::error::Remote state changed during this run. Refusing to overwrite it; recover this run from its state artifact.'
              exit 1
            fi

            # Keep remote code changes while replaying our state-only commit.
            # Explicitly replay the one local state commit onto remote HEAD;
            # this works on a shallow checkout without fetching old history.
            if ! git rebase --onto "$remote_revision" "$base_revision" HEAD; then
              git rebase --abort || true
              echo '::error::Could not rebase the state-only commit. State will be kept as an artifact.'
              exit 1
            fi
          done

          echo '::error::State/journal push failed after 5 attempts. Download the state artifact from this run.'
          exit 1

      - name: Keep state if repository save failed
        if: ${{ always() && steps.persist.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: bzu-v12-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            last_signal_v6_4.json
            signal_journal_v6_4.json
            market_history_v12.json
            research_market_v12_6.json
          if-no-files-found: warn
          retention-days: 7
