# Before starting: set GitHub repository variable BZU_SERVER_MODE=WORKER.
# Copy latest multi_scanner_memory.json and multi_scanner_state.json into ./data once.
services:
  bzu-mexc-worker:
    build: .
    command: ["python", "mexc_worker.py"]
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    env_file:
      - path: .env
        required: false
    environment:
      MEXC_DATA_DIR: /app/data
      MEXC_SCAN_INTERVAL_SEC: "180"
      LIVE_HTTP_BIND: 0.0.0.0
      LIVE_HTTP_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
