name: BZU v16.0 M1 M5 nine-family research (PAPER only)
on:
  workflow_dispatch:
    inputs:
      start:
        description: UTC start (YYYY-MM-DD)
        required: true
        default: '2026-11-08'
      end:
        description: UTC exclusive end (YYYY-MM-DD)
        required: true
        default: '2026-11-28'
      mode:
        description: Candidate study, or candidate study plus actual rolling slot replay
        type: choice
        options: [candidates, candidates_and_rolling]
        default: candidates
      split:
        description: Rolling replay split date (only for candidates_and_rolling)
        required: true
        default: '2026-11-21'
      validation_mode:
        description: forward requires >= 7 days from 2026-11-28
        type: choice
        options: [development, forward]
        default: development
      spread_bps:
        description: Additional full quoted spread in bps
        required: true
        default: '0'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      MEXC_FUTURES_BASE: 'https://api.mexc.com'
      MEXC_TAKER_FEE_RATE: '0.0002'
      MEXC_MAKER_FEE_RATE: '0.0002'
      MEXC_SLIPPAGE_RATE: '0.0001'
      BZU_ALLOW_M1_ENTRY: 'true'
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      SPLIT: ${{ inputs.split }}
      MODE: ${{ inputs.mode }}
      VALIDATION_MODE: ${{ inputs.validation_mode }}
      SPREAD_BPS: ${{ inputs.spread_bps }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: candles
        with:
          path: mexc_replay_cache
          key: mexc-h1-coverage-${{ inputs.start }}-${{ inputs.end }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mexc-h1-coverage-${{ inputs.start }}-${{ inputs.end }}-
            mexc-h1-coverage-
      - name: Candidate audit all seven assets (strict UTC window)
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$VALIDATION_MODE" == forward ]]; then EXTRA+=(--forward); fi
          python mexc_alpha_audit_v160.py --data mexc_replay_cache --start "$START" --end "$END" --download --interval 180 --spread-bps "$SPREAD_BPS" --workers 3 --out alpha_audit "${EXTRA[@]}"
      - name: Actual M1/M5 rolling portfolio replay, no live state writes
        if: ${{ inputs.mode == 'candidates_and_rolling' }}
        run: python mexc_replay_v154.py --data mexc_replay_cache --start "$START" --split "$SPLIT" --end "$END" --interval 180 --spread-bps "$SPREAD_BPS" --output MEXC_REPLAY_REPORT.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: mexc_replay_cache
          key: ${{ steps.candles.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mexc-v160-alpha-research
          path: |
            alpha_audit/*.json
            MEXC_REPLAY_REPORT.json
            mexc_replay_cache/*.csv
            mexc_replay_cache/ticks.json
            mexc_replay_cache/contract_specs.json
          if-no-files-found: warn
