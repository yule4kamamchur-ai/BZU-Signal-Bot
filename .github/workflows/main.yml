name: BZU MULTI v15.1 — MEXC scanner
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    concurrency:
      group: bzu-mexc-hybrid-memory
      cancel-in-progress: false
    if: ${{ vars.BZU_SERVER_MODE != 'WORKER' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PYTHONUNBUFFERED: '1'
      MEXC_SCAN_INTERVAL_SEC: '300'
      MEXC_TAKER_FEE_RATE: ${{ vars.MEXC_TAKER_FEE_RATE || '0.0005' }}
      MEXC_SLIPPAGE_RATE: ${{ vars.MEXC_SLIPPAGE_RATE || '0.0001' }}
      BZU_DEPOSIT_USDT: ${{ vars.BZU_DEPOSIT_USDT || '100' }}
      BZU_RISK_PCT: ${{ vars.BZU_RISK_PCT || '3' }}
      BZU_MAX_LEVERAGE: ${{ vars.BZU_MAX_LEVERAGE || '5' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate and scan MEXC only
        id: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m py_compile mexc_multi_scanner.py mexc_hybrid.py mexc_lifecycle.py mexc_geometry.py
          python mexc_multi_scanner.py --notify
      - name: Persist small MEXC state only
        id: persist
        if: ${{ steps.scan.outcome == 'success' }}
        env:
          BOT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f multi_scanner_state.json multi_scanner_memory.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update MEXC hybrid state [skip ci]'
            for attempt in 1 2 3; do
              if git push origin "HEAD:${BOT_BRANCH}"; then exit 0; fi
              base=$(git rev-parse HEAD^)
              git fetch --depth=1 origin "$BOT_BRANCH"
              remote=$(git rev-parse FETCH_HEAD)
              if ! git diff --quiet "$base" "$remote" -- multi_scanner_state.json multi_scanner_memory.json; then
                echo '::error::Another MEXC writer changed the state; refusing overwrite.'
                exit 1
              fi
              git rebase --onto "$remote" "$base" HEAD
            done
            exit 1
          fi
      - name: Preserve state on failure
        if: ${{ always() && steps.persist.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mexc-recovery-${{ github.run_id }}
          path: |
            multi_scanner_state.json
            multi_scanner_memory.json
          if-no-files-found: warn
      - name: Prepare dashboard files
        env:
          BOT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        if: ${{ steps.persist.outcome == 'success' }}
        run: |
          mkdir -p pages-artifact
          cp index.html live_terminal.css multi_scanner.js multi_scanner_state.json pages-artifact/
          # Public repo only; no token, no private file access from browser.
          python - <<'PY'
          import os, html
          from pathlib import Path
          from urllib.parse import quote
          if os.environ.get('REPO_PRIVATE','true').lower() == 'false':
              src = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + quote(os.environ['BOT_BRANCH'],safe='') + '/multi_scanner_state.json'
              p = Path('pages-artifact/index.html')
              p.write_text(p.read_text().replace('name="bzu-state-source" content=""', 'name="bzu-state-source" content="'+html.escape(src,quote=True)+'"'))
          PY
      - name: Upload dashboard
        if: ${{ steps.persist.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact
  deploy-pages:
    concurrency:
      group: bzu-mexc-pages-only
      cancel-in-progress: false
    needs: scan
    if: ${{ needs.scan.result == 'success' && vars.BZU_SERVER_MODE != 'WORKER' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
