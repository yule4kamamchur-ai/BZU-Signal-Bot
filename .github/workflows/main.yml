name: BZU Auto Bot — ICT v12.9.0 — Anticipatory execution atlas

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '5,10,20,25,35,40,50,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Keep the original lock so queued runs of the old workflow cannot overlap.
concurrency:
  group: bzu-signal-memory
  cancel-in-progress: false

jobs:
  run-bot:
    if: ${{ vars.BOT_RUNTIME_MODE != 'worker' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BOT_BRANCH: ${{ github.event.repository.default_branch }}
      JOURNAL_PERSISTENCE_CONFIRMED: 'true'
      SIGNAL_MEMORY_FILE: last_signal_v6_4.json
      SIGNAL_JOURNAL_FILE: signal_journal_v6_4.json
      MARKET_HISTORY_FILE: market_history_v12.json
      RESEARCH_ARCHIVE_FILE: research_market_v12_6.json
      OKX_INST_ID: ${{ vars.OKX_INST_ID || 'BZ-USDT-SWAP' }}
      # Live price tick is read from OKX by full_limit_engine.py.
      EXPECTED_BOT_VERSION: 'full-ict-v12.9.0-anticipatory-execution-atlas'
      INCLUDE_COMMISSION: 'true'
      ANALYSIS_SCAN_MINUTES: '5'
      ABS_MIN_STOP_PCT: '0.01'
      MIN_TP1_DISTANCE_PCT: '0.015'
      MAKER_FEE_RATE: ${{ vars.MAKER_FEE_RATE || '0.0002' }}
      TAKER_FEE_RATE: ${{ vars.TAKER_FEE_RATE || '0.0005' }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # v12 has a stdlib fallback; requirements.txt is not required.
      - name: Verify complete v12 files
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          required = ['bot_oneshot.py', 'full_limit_engine.py',
                      'signal_quality.py', 'setup_scanner.py', 'notification_report.py', 'research_evidence.py', 'research_history.py', 'research_v12_6.py', 'lifecycle_forecast.py', 'trade_dependencies.py', 'test_v12_6_policy.py', 'test_v12_7_policy.py', 'test_v12_8_paths.py', 'setup_paths.py', 'execution_atlas.py', 'continuous_worker.py', 'test_v12_9_atlas.py', 'analyze_bot.py', 'test_notification_report.py', 'price_forecast.py', 'limit_structure.py', 'market_archive.py', 'test_full_limit_engine.py',
                      'test_v12_4_scanner.py', 'test_v12_4_1_selection.py', 'test_v12_4_2_reports.py', 'test_v12_4_3_geometry.py', 'test_v12_5_early_limits.py', 'testdata/reported_20261014.json', 'setup_preservation_manifest.json']
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit('Upload the complete v12 package. Missing: ' + ', '.join(missing))
          import bot_oneshot as core
          import full_limit_engine as engine
          expected=os.environ['EXPECTED_BOT_VERSION']
          if core.BOT_VERSION != expected or engine.VERSION != expected or len(core.DETECTORS) != 24:
              raise SystemExit('Incompatible bot files: all 24 detectors and matching v12 versions are required')
          PY

      - name: Validate full v12 bot offline
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *' }}
        run: |
          python -m py_compile bot_oneshot.py full_limit_engine.py signal_quality.py setup_scanner.py notification_report.py analyze_bot.py price_forecast.py limit_structure.py market_archive.py test_v12_4_2_reports.py test_v12_4_3_geometry.py
          python bot_oneshot.py --self-test
          # Original compatibility fixtures assume their original 0.4% floor.
          # Production and the full new test suite retain the 1% floor above.
          ABS_MIN_STOP_PCT=0.004 python bot_oneshot.py --legacy-self-test

      - name: Verify Telegram settings
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('TELEGRAM_TOKEN') or not os.environ.get('TELEGRAM_CHAT_ID'):
              raise SystemExit('Set TELEGRAM_TOKEN and TELEGRAM_CHAT_ID in GitHub Actions secrets')
          PY

      - name: Run full v12 signal cycle
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *' }}
        id: bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NOTIFY_EVERY_RUN: 'true'
        run: python bot_oneshot.py --notify

      - name: Scan and supervise between 15-minute reports
        if: ${{ github.event.schedule == '5,10,20,25,35,40,50,55 * * * *' }}
        id: silent_scan
        run: python bot_oneshot.py

      - name: Save signal memory and journal
        id: persist
        if: ${{ always() && (steps.bot.outcome == 'success' || steps.bot.outcome == 'failure' || steps.silent_scan.outcome == 'success' || steps.silent_scan.outcome == 'failure') }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Commit only runtime files, never remove unrelated or legacy files.
          for file in last_signal_v6_4.json signal_journal_v6_4.json market_history_v12.json research_market_v12_6.json; do
            if [ -f "$file" ]; then
              git add -f -- "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo 'No memory/journal changes to commit.'
            exit 0
          fi

          git commit -m 'Update full ICT v12 memory and journal [skip ci]'

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BOT_BRANCH}"; then
              echo 'Memory and journal saved.'
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              break
            fi

            git fetch origin "$BOT_BRANCH"
            base_revision=$(git rev-parse HEAD^)
            remote_revision=$(git rev-parse "origin/${BOT_BRANCH}")

            # A different writer changed the same ledger: preserve both copies.
            if ! git diff --quiet "$base_revision" "$remote_revision" -- \
                last_signal_v6_4.json signal_journal_v6_4.json market_history_v12.json research_market_v12_6.json; then
              echo '::error::Remote state changed during this run. Refusing to overwrite it; recover this run from its state artifact.'
              exit 1
            fi

            # Keep remote code changes while replaying our state-only commit.
            if ! git rebase "$remote_revision"; then
              git rebase --abort || true
              echo '::error::Could not rebase the state-only commit. State will be kept as an artifact.'
              exit 1
            fi
          done

          echo '::error::State/journal push failed after 5 attempts. Download the state artifact from this run.'
          exit 1

      - name: Keep state if repository save failed
        if: ${{ always() && steps.persist.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: bzu-v12-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            last_signal_v6_4.json
            signal_journal_v6_4.json
            market_history_v12.json
            research_market_v12_6.json
          if-no-files-found: warn
          retention-days: 7
